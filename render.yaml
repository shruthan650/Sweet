services:
  - type: web
    name: sweet-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SWEET_WORKER_BASE_URL
        sync: false
      - key: SWEET_WORKER_SHARED_SECRET
        sync: false
      - key: SWEET_API_ACCESS_TOKEN
        sync: false
