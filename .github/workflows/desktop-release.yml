name: Desktop release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend and Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test backend
        run: mvn --batch-mode test

      - name: Build backend Docker image
        run: docker build --tag sweet-backend:ci .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Test and typecheck Worker
        run: |
          npm --prefix worker ci
          npm --prefix worker test
          npm --prefix worker run typecheck

  package:
    name: Package ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: sweet-windows-x64
          - os: macos-latest
            artifact: sweet-macos-arm64
          - os: ubuntu-latest
            artifact: sweet-linux-x64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Test and package desktop
        run: mvn --batch-mode --file desktop/pom.xml verify

      - name: Create native app image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pom = [xml](Get-Content desktop/pom.xml -Raw)
          $version = $pom.project.version -replace '-SNAPSHOT$', ''
          $jar = Get-ChildItem desktop/target -Filter 'sweet-desktop-*.jar' -File |
            Where-Object { $_.Name -notlike '*.original' } |
            Select-Object -First 1
          if (-not $jar) { throw 'Desktop application JAR was not created.' }
          Copy-Item $jar.FullName desktop/target/package-input/ -Force
          $destination = 'desktop/target/dist'
          New-Item -ItemType Directory -Force $destination | Out-Null
          $jpackageArgs = @(
            '--type', 'app-image',
            '--name', 'Sweet',
            '--input', 'desktop/target/package-input',
            '--main-jar', $jar.Name,
            '--main-class', 'com.shruthan.sweet.desktop.SweetDesktopApplication',
            '--java-options', '--enable-native-access=ALL-UNNAMED',
            '--dest', $destination
          )
          # macOS requires a positive first version component; omit this optional
          # metadata flag there and let jpackage use its valid default.
          if ($env:RUNNER_OS -ne 'macOS') {
            $jpackageArgs += @('--app-version', $version)
          }
          & jpackage @jpackageArgs
          if ($LASTEXITCODE -ne 0) { throw 'jpackage failed.' }

      - name: Archive app image
        shell: pwsh
        env:
          RELEASE_ASSET: ${{ matrix.artifact }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "$env:RELEASE_ASSET.tar.gz"
          $appImage = 'Sweet'
          if (Test-Path desktop/target/dist/Sweet.app) { $appImage = 'Sweet.app' }
          tar -czf $archive -C desktop/target/dist $appImage
          if ($LASTEXITCODE -ne 0) { throw 'Failed to archive app image.' }

      - name: Upload app image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Build Windows JAR bundle
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./desktop/package-jar.ps1 -Maven mvn

      - name: Upload Windows JAR bundle
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: sweet-windows-x64-jar
          path: desktop/target/dist/sweet-desktop-windows-x64-jar.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" release-assets/* --generate-notes
